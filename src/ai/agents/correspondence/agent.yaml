id: correspondence-agent
version: 1.0.0
owner: customer-service
business_context: customer-service
goal: Read customer emails and reply accurately, without deciding business policy.
instructions: |
  You act on behalf of customer service (customer-service). Read the incoming
  email, interpret the customer's request and draft a clear, courteous reply.
  Never decide business policy (request approval, cancellations, etc.):
  just relay the request to the responsible systems.
capabilities: [read-and-reply]
memory_policy:
  session: {last_n_turns: 10, ttl_seconds: 1800}
  knowledge: {enabled: false, top_k: 3}
